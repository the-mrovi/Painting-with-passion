<!doctype html>
<html lang="en" class="auth-pending">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Painting with passion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <script src="theme.js"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script><script src="supabase-config.js"></script><script src="app.js" defer></script><script src="auth.js" defer></script>
</head>
<body data-auth-mode="login">
    <nav class="site-nav minimal-nav"><a class="wordmark" href="index.html"><span>Painting</span> with passion</a><button class="theme-toggle" type="button" data-theme-toggle>Dark</button></nav>
    <main class="auth-page">
        <section class="auth-art" aria-hidden="true"><span class="auth-paint one"></span><span class="auth-paint two"></span><blockquote>“The studio is quieter when shared with people who care.”</blockquote></section>
        <section class="auth-panel">
            <div class="auth-heading"><p class="eyebrow" id="auth-eyebrow">The private studio</p><h1 id="auth-title">Welcome in</h1><p id="auth-description">Sign in to see artworks, highlights, and your orders.</p></div>
            <div class="auth-switch" role="group" aria-label="Choose authentication mode"><button class="active" type="button" data-auth-mode="login">Sign in</button><button type="button" data-auth-mode="register">Create account</button></div>
            <form class="stacked-form" id="auth-form">
                <div class="register-field"><label>Full name<input name="full_name" autocomplete="name"></label></div>
                <div class="register-field"><label>Phone <span class="optional">Optional</span><input name="phone_number" type="tel" autocomplete="tel"></label></div>
                <label>Email<input name="email" type="email" autocomplete="email" required></label>
                <label class="auth-password-row">Password<span class="password-field"><input id="auth-password" name="password" type="password" autocomplete="current-password" required><button type="button" data-password-toggle="auth-password">Show</button></span></label>
                <div class="register-field"><label>Confirm password<span class="password-field"><input id="auth-password-confirmation" name="password_confirmation" type="password" autocomplete="new-password"><button type="button" data-password-toggle="auth-password-confirmation">Show</button></span></label></div>
                <div class="form-message" id="auth-message" aria-live="polite"></div>
                <button class="button primary wide" id="auth-submit" type="submit">Sign in</button>
                <button class="forgot-link" id="forgot-password" type="button">Forgot password?</button>
                <button class="forgot-link recovery-back" id="back-to-login" type="button">← Back to sign in</button>
            </form>
            <a class="back-link" href="index.html">← Back to the open studio</a>
        </section>
    </main>
    <footer class="auth-footer"><a href="https://www.instagram.com/painting_with_passion_._/" target="_blank" rel="noreferrer">Instagram</a><span>Developed by Rahman Ovi</span></footer>
</body>
</html>
